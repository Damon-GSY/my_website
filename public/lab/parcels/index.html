<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcels · Design studies · Damon Guan</title>
<meta name="description" content="Work, shipped in six cartons. Each project is a labelled parcel that unfolds into its case study.">
<style>
@font-face{font-family:'Archivo';src:url('/lab/concepts/archivo.woff2') format('woff2-variations');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:'Cartograph CF';src:url('/fonts/CartographCF-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--bg:#f4f4f2;--ink:#0d0d0d;--muted:#8a8a88;--hair:#d9d9d5;--accent:#ff2d8a;--W:560px;--D:340px;--H:300px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;overflow-x:hidden;min-height:100vh}
a{color:inherit}
.mono{font-family:'Cartograph CF',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.acc{color:var(--accent)}
.mut{color:var(--muted)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* nav */
.nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--hair);position:relative;z-index:10;background:var(--bg)}
.nav a{text-decoration:none}
.nav .brand{font-weight:850;letter-spacing:-.035em;font-size:19px}
.nav .brand em{font-style:normal;color:var(--muted);font-weight:500}
.nav .lab{color:#222}
.nav a:hover{color:var(--accent)}
/* stage */
.stage{position:relative;width:100%;overflow:hidden}
.layer{position:absolute;inset:0;perspective:1700px}
.scene{position:absolute;left:0;top:0;width:0;height:0}
.scene,.carton,.body,.box,.ocarton,.flap,.pnl{transform-style:preserve-3d}
.floor{position:absolute;background:repeating-linear-gradient(0deg,rgba(13,13,13,.07) 0 1px,transparent 1px 40px),repeating-linear-gradient(90deg,rgba(13,13,13,.07) 0 1px,transparent 1px 40px);-webkit-mask-image:radial-gradient(closest-side,#000 40%,transparent 100%);mask-image:radial-gradient(closest-side,#000 40%,transparent 100%)}
/* shelf copy */
.copy{position:absolute;left:40px;top:48px;z-index:5;max-width:440px;pointer-events:none}
.copy h1{font-weight:850;font-size:clamp(40px,4.6vw,68px);letter-spacing:-.04em;line-height:.93;font-stretch:96%}
.copy p{margin-top:14px;color:#6d6d6b}
.copy .lede{font-family:'Archivo',sans-serif;text-transform:none;letter-spacing:-.005em;font-size:17px;line-height:1.4;color:#3b3b3a;margin-top:16px;max-width:360px}
.foot{position:absolute;left:40px;bottom:22px;z-index:5;color:var(--muted);font-size:10px}
/* shelf cartons */
.carton{position:absolute;display:block;outline:none;text-decoration:none;cursor:pointer}
.carton .body{position:absolute;inset:0;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.carton .shadow{position:absolute;inset:0;background:rgba(30,26,20,.32);filter:blur(9px);border-radius:6px;transform:translate(6px,4px);transition:transform .35s cubic-bezier(.2,.7,.2,1),filter .35s,opacity .35s}
.carton:hover .body,.carton:focus .body,.carton.lift .body{transform:translateZ(70px) rotateZ(-6deg)}
.carton:hover .shadow,.carton:focus .shadow,.carton.lift .shadow{transform:translate(14px,10px);filter:blur(18px);opacity:.55}
.carton:focus-visible .f.top{outline:3px solid var(--ink);outline-offset:4px}
.carton.gone{visibility:hidden}
.f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(13,13,13,.08)}
.f.top{left:0;top:0;width:100%;height:100%;background:linear-gradient(135deg,#ffffff,#f3f2ee)}
.f.front{left:0;width:100%;transform-origin:50% 100%;transform:rotateX(-90deg);background:linear-gradient(180deg,#f1f0ec,#e4e3de)}
.f.back{left:0;top:0;width:100%;transform-origin:50% 0;transform:rotateX(90deg);background:#ebeae6}
.f.right{top:0;height:100%;transform-origin:100% 50%;transform:rotateY(90deg);background:linear-gradient(90deg,#d2d1cc,#c7c6c0)}
.f.left{left:0;top:0;height:100%;transform-origin:0 50%;transform:rotateY(-90deg);background:#e2e1dc}
.f.top:before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(13,13,13,.12)}
.tape{position:absolute;background:linear-gradient(90deg,#ff2d8a,#ff4b9b 45%,#e81f7a);opacity:.96}
.tape.t{left:calc(50% - 12px);width:24px;top:0;height:100%}
.tape.fr{left:calc(50% - 12px);width:24px;top:0;height:16px}
.label{position:absolute;left:10px;right:10px;top:21px;bottom:7px;background:#fff;box-shadow:0 0 0 1px rgba(13,13,13,.18);padding:5px 7px 6px;display:flex;flex-direction:column;justify-content:space-between}
.label .ln{display:flex;justify-content:space-between;font-size:7px;color:#666;letter-spacing:.05em}
.label .nm{font-weight:760;font-size:11.5px;line-height:1.02;letter-spacing:-.02em}
.label .big{font-weight:900;font-size:22px;line-height:.82;letter-spacing:-.045em;display:flex;justify-content:space-between;align-items:flex-end}
.bc{display:block;width:40px;height:13px;background:repeating-linear-gradient(90deg,#0d0d0d 0 1px,transparent 1px 3px,#0d0d0d 3px 5px,transparent 5px 6px,#0d0d0d 6px 7px,transparent 7px 9px)}
.tip{position:absolute;z-index:6;background:var(--ink);color:#fff;font-size:11px;padding:6px 9px;transform:translateX(-50%);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.strip{position:absolute;z-index:4;display:none;flex-direction:column;gap:5px;padding:8px 10px 9px;background:#fff;box-shadow:0 0 0 1px rgba(13,13,13,.16),0 10px 18px -14px rgba(0,0,0,.35);text-decoration:none;cursor:pointer}
.strip:before{content:'';position:absolute;left:calc(50% - 9px);top:-6px;width:18px;height:6px;background:var(--accent)}
.strip .ln{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#6d6d6b;font-size:10px}
.strip .ln b{font-family:'Archivo',sans-serif;font-weight:900;font-size:19px;letter-spacing:-.04em;line-height:.9;color:var(--ink);text-transform:none}
.strip .sn{font-weight:740;font-size:14px;line-height:1.12;letter-spacing:-.015em;color:var(--ink)}
.strip.on{box-shadow:0 0 0 1.5px var(--ink)}
/* opener: one carton built at page size */
.olayer[hidden]{display:none}
.ocarton{position:absolute;left:calc(var(--W) / -2);top:calc(var(--D) / -2);width:var(--W);height:var(--D)}
.oshadow{position:absolute;left:calc(var(--W) / -2);top:calc(var(--D) / -2);width:var(--W);height:var(--D);background:rgba(30,26,20,.4);filter:blur(40px);transform:translateZ(-2px)}
.pnl,.flap{position:absolute}
.base{left:0;top:0;width:var(--W);height:var(--D)}
.fb{left:0;top:calc(var(--H) * -1);width:var(--W);height:var(--H);transform-origin:50% 100%}
.ff{left:0;top:var(--D);width:var(--W);height:var(--H);transform-origin:50% 0}
.fl{left:calc(var(--H) * -1);top:0;width:var(--H);height:var(--D);transform-origin:100% 50%}
.fr{left:var(--W);top:0;width:var(--H);height:var(--D);transform-origin:0 50%}
.lid{left:0;top:calc(var(--D) * -1);width:var(--W);height:var(--D);transform-origin:50% 100%}
.in,.out{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.out{transform:rotateY(180deg);box-shadow:inset 0 0 0 1px rgba(13,13,13,.08)}
.ff>.out,.fb>.out{transform:rotateX(180deg)}
.ff>.out{background:linear-gradient(0deg,#f1f0ec,#e4e3de)}
.fb>.out{background:#ebeae6}
.fl>.out{background:#e2e1dc}
.fr>.out{background:linear-gradient(270deg,#d2d1cc,#c7c6c0)}
.lid>.out{background:linear-gradient(135deg,#ffffff,#f3f2ee)}
.lid>.in{background:#f0efeb}
.sw{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(3.3333)}
/* inside print = the case study */
.pin{background:#fbfbf9;box-shadow:inset 0 0 0 1px var(--hair);padding:26px 30px;font-size:17.5px;line-height:1.48;color:#2b2b2a;user-select:text;-webkit-user-select:text;cursor:auto}
.pin h2{font-weight:760;font-size:24px;letter-spacing:-.025em;line-height:1.1;color:var(--ink);margin:14px 0 10px}
.pin .mono{font-size:11.5px}
.pbase{background:#fff;box-shadow:0 0 0 1px var(--hair),0 40px 80px -50px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:space-between;padding:28px 34px 30px}
.pbase h1{font-weight:880;font-size:50px;line-height:.93;letter-spacing:-.045em;color:var(--ink);max-width:430px;outline:none}
.met{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.met b{font-weight:900;font-size:124px;letter-spacing:-.06em;line-height:.78;color:var(--ink)}
.met span{font-size:16.5px;color:#555;text-align:right;line-height:1.4}
.ptop{display:flex;flex-direction:column;justify-content:space-between}
.ptop .row,.pbot .row{display:flex;justify-content:space-between;align-items:baseline}
.slip{display:grid;grid-template-columns:140px 1fr;gap:6px 18px;font-size:16.5px;margin-top:6px}
.slip dt{font-family:'Cartograph CF',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);padding-top:4px}
.slip dd{color:var(--ink)}
.fn{font-size:14px;color:#6d6d6b;line-height:1.4}
.go{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:780;font-size:22px;letter-spacing:-.025em;color:var(--ink);padding:4px 0;border-bottom:2px solid var(--ink);align-self:flex-start}
.go:hover{color:var(--accent);border-color:var(--accent)}
.ptop .end{display:flex;align-items:flex-end;justify-content:space-between}
.bcl{display:block;width:150px;height:34px;background:repeating-linear-gradient(90deg,#0d0d0d 0 2px,transparent 2px 5px,#0d0d0d 5px 9px,transparent 9px 11px,#0d0d0d 11px 12px,transparent 12px 16px)}
.pbot{display:flex;flex-direction:column;justify-content:space-between}
.nextcard{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px 20px;text-decoration:none;padding:16px 18px;background:#fff;box-shadow:0 0 0 1px rgba(13,13,13,.18);margin-top:14px}
.nextcard .nm{font-weight:780;font-size:26px;letter-spacing:-.03em;line-height:1}
.nextcard b{font-weight:900;font-size:52px;letter-spacing:-.05em;line-height:.8;grid-row:1 / span 2;grid-column:2}
.nextcard .mono{grid-column:1}
.nextcard:hover .nm,.nextcard:focus-visible .nm{color:var(--accent)}
/* phone */
@media (max-width:759px){
  .nav{padding:0 16px}
  .nav .brand{font-size:17px}
  .copy{left:16px;right:16px;top:28px}
  .copy .lede{font-size:15px}
  .strip{display:flex}
  .foot{left:16px;right:16px;bottom:16px}
  .olayer{position:relative;inset:auto;perspective:none;padding:20px 16px 40px}
  .oscene,.ocarton{position:static;width:auto;height:auto;transform:none}
  .oscene,.ocarton,.flap,.pnl{transform-style:flat}
  .ocarton{display:flex;flex-direction:column;gap:0}
  .oshadow,.out,.lid{display:none}
  .pnl,.flap{position:relative;left:auto;top:auto;width:auto;height:auto;transform-origin:50% 0}
  .in{position:relative;inset:auto}
  .pin{padding:20px 20px 22px;font-size:16px}
  .pbase{gap:26px;min-height:300px}
  .pbase h1{font-size:40px}
  .met b{font-size:84px}
  .met span{font-size:13.5px}
  .slip{grid-template-columns:110px 1fr;font-size:15px}
  .ptop{gap:18px}
  .ptop .end .bcl{width:90px}
  .nextcard .nm{font-size:22px}
  .nextcard b{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  .carton .body,.carton .shadow,.tip{transition:none}
}
</style>
</head>
<body>
<nav class="nav" aria-label="Site">
  <a class="brand" href="/">Damon Guan <em>&mdash;</em></a>
  <a class="lab mono" href="/lab">Design studies</a>
</nav>
<main class="stage" id="stage">
  <div class="copy" id="copy">
    <h1>Work, shipped<br>in six cartons.</h1>
    <p class="lede">Each project is a delivered unit with one honest number on the label. Pick a carton to open its case study.</p>
    <p class="mono">06 parcels &middot; pick one to open</p>
  </div>
  <div class="layer" id="shelfLayer" role="list" aria-label="Six parcels"></div>
  <div class="layer olayer" id="olayer" hidden>
    <div class="scene oscene" id="oscene">
      <div class="oshadow" id="oshadow"></div>
      <article class="ocarton" id="ocarton" aria-labelledby="ptitle">
        <div class="flap fb" id="fb"><div class="in pin ptop" id="pTop"></div><div class="out"></div>
          <div class="flap lid" id="lid"><div class="in"></div><div class="out"><div class="sw" style="width:168px;height:102px"><div class="tape t" style="clip-path:polygon(0 0,100% 0,100% 100%,84% 97%,66% 99.5%,48% 96.5%,30% 99%,14% 96%,0 99%)"></div></div></div></div>
        </div>
        <div class="pnl base" id="base"><div class="in pin pbase" id="pBase"></div></div>
        <div class="flap fl" id="fl"><div class="in pin" id="pLeft"></div><div class="out"></div></div>
        <div class="flap fr" id="fr"><div class="in pin" id="pRight"></div><div class="out"></div></div>
        <div class="flap ff" id="ff"><div class="in pin pbot" id="pBot"></div><div class="out"><div class="sw" id="oLabel" style="width:168px;height:90px"></div></div></div>
      </article>
    </div>
  </div>
  <div class="tip mono" id="tip" aria-hidden="true"></div>
  <p class="foot mono" id="foot">Production figures are internal measurements, not public benchmarks.</p>
</main>
<script>
(function(){
const P=[
 {n:'01',slug:'supply-chain-agent-system',name:'Supply Chain Agent System',fig:'≈90%',cap:'fewer misoperations',sub:'12 scenarios',prod:true,
  what:['An agent system','Language agents that carry out supply-chain operations, measured across 12 scenarios before anyone relies on them.'],
  held:['Bound the authority','Each agent acts inside a fixed scope. When something goes wrong, read the trace before changing the model.']},
 {n:'02',slug:'dynamic-tool-resolution',name:'Dynamic Tool Resolution',fig:'100+',cap:'tools',sub:'one agent, many tools',prod:true,
  what:['A tool resolver','Working out which tool an agent should reach for when the set it can draw on runs past 100.'],
  held:['Bound the authority','The fewer tools an agent can reach at any moment, the easier each of its actions is to check.']},
 {n:'03',slug:'supply-chain-domain-llm',name:'Supply-Chain Domain LLM',fig:'SOTA',cap:'on internal evaluation',sub:'domain model',prod:true,
  what:['A domain model','A language model for supply-chain work. On internal evaluation it is state of the art.'],
  held:['Evaluate before training','Decide how a model will be judged before changing it, so every gain is measured against the same yardstick.']},
 {n:'04',slug:'multi-objective-attribute-rl',name:'Multi-Objective Attribute RL',fig:'GRPO',cap:'training method',sub:'multi-objective RL',prod:false,
  what:['A training method','Reinforcement learning that balances several attribute objectives at once, trained with GRPO.'],
  held:['Evaluate before training','Each objective needs its own measure before it can be traded against the others.']},
 {n:'05',slug:'m365-copilot-memory',name:'M365 Copilot Memory',fig:'3',cap:'memory layers',sub:'Microsoft 365 Copilot',prod:false,
  what:['A memory system','Memory for Microsoft 365 Copilot, organised in three layers.'],
  held:['Read the trace','What an assistant remembers should be inspectable: each layer can be read back and checked.']},
 {n:'06',slug:'supchain-bench',name:'SupChain-Bench',fig:'530',cap:'samples',sub:'ACL Findings 2026',prod:false,
  what:['A benchmark','A benchmark for supply-chain agents with 530 samples, published in ACL Findings 2026.'],
  held:['Evaluate before training','The benchmark is the measure: build it first, then train against it.']}
];
const FOOT='Production figures are internal measurements, not public benchmarks.';
const K=0.3, W=168, D=102, H=90, LZ=70, LR=-6, GYM=196, RXM=44;           // shelf carton = open carton x 0.3
const NET_W=1160, NET_H=940, DUR=900, DUR_CLOSE=700;
const $=id=>document.getElementById(id);
const stage=$('stage'), shelfLayer=$('shelfLayer'), olayer=$('olayer'), oscene=$('oscene'), ocarton=$('ocarton'),
      oshadow=$('oshadow'), tip=$('tip'), copy=$('copy'), foot=$('foot');
const fl={fb:$('fb'),ff:$('ff'),fl:$('fl'),fr:$('fr'),lid:$('lid'),base:$('base')};
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let mobile=false, cols=0, cartons=[], strips=[], shelfScene=null, G={}, cur=-1, busy=false, anims=[];

function el(tag,cls,style,html){const e=document.createElement(tag);if(cls)e.className=cls;if(style)e.style.cssText=style;if(html!=null)e.innerHTML=html;return e}
const labelHTML=p=>`<div class="tape fr"></div><div class="label"><div class="ln mono"><span>Parcel ${p.n}/06</span><span>Fragile</span></div><div class="nm">${esc(p.name)}</div><div class="big"><span>${p.fig}</span><span class="bc"></span></div></div>`;

function buildShelf(c){
  cols=c; shelfLayer.innerHTML=''; cartons=[]; strips=[];
  const rows=Math.ceil(P.length/c), GX=c===3?44:30, GY=c===3?56:GYM;
  const gw=c*W+(c-1)*GX, gd=rows*D+(rows-1)*GY;
  shelfScene=el('div','scene');
  shelfScene.append(el('div','floor',`left:${-gw/2-200}px;top:${-gd/2-160}px;width:${gw+400}px;height:${gd+320}px`));
  P.forEach((p,i)=>{
    const x=-gw/2+(i%c)*(W+GX), y=-gd/2+Math.floor(i/c)*(D+GY);
    const a=el('a','carton',`left:${x}px;top:${y}px;width:${W}px;height:${D}px`);
    a.href='#'+p.slug; a.setAttribute('role','listitem');
    a.setAttribute('aria-label',`Open parcel ${p.n}: ${p.name}, ${p.fig} ${p.cap}`);
    a.dataset.i=i; a._x=x+W/2; a._y=y+D/2;
    a.append(el('div','shadow'));
    const b=el('div','body');
    b.append(el('div','f top','transform:translateZ('+H+'px)','<div class="tape t"></div>'));
    b.append(el('div','f front',`top:${D-H}px;height:${H}px`,labelHTML(p)));
    b.append(el('div','f back',`height:${H}px`));
    b.append(el('div','f right',`left:${W-H}px;width:${H}px`));
    b.append(el('div','f left',`width:${H}px`));
    a.append(b);
    a.addEventListener('click',e=>{e.preventDefault();go(p.slug)});
    a.addEventListener('mouseenter',()=>showTip(i));
    a.addEventListener('focus',()=>showTip(i));
    a.addEventListener('mouseleave',()=>{a.classList.remove('lift');if(document.activeElement!==a)hideTip()});
    a.addEventListener('blur',()=>{a.classList.remove('lift');hideTip()});
    shelfScene.append(a); cartons.push(a);
    const st=el('a','strip',null,`<span class="ln mono"><span>Parcel ${p.n}/06</span><b>${p.fig}</b></span><span class="sn">${esc(p.name)}</span>`);
    st.href='#'+p.slug; st.tabIndex=-1; st.setAttribute('aria-hidden','true');
    st.addEventListener('click',e=>{e.preventDefault();go(p.slug)});
    a._strip=st; strips.push(st);
  });
  shelfLayer.append(shelfScene,...strips);
}
function showTip(i){
  if(cur>=0||busy)return;
  if(mobile){strips.forEach((s,k)=>s.classList.toggle('on',k===i));return}
  const r=cartons[i].querySelector('.front').getBoundingClientRect(), s=stage.getBoundingClientRect();
  tip.textContent=`Open ${P[i].n} · ${P[i].name}`;
  tip.style.left=Math.min(Math.max(r.left+r.width/2-s.left,130),s.width-130)+'px';
  tip.style.top=(r.bottom-s.top+18)+'px'; tip.classList.add('on');
}
function hideTip(){tip.classList.remove('on');strips.forEach(s=>s.classList.remove('on'))}

function layout(){
  mobile=innerWidth<760;
  if(cols!==(mobile?2:3)){buildShelf(mobile?2:3); if(cur>=0) cartons[cur].classList.add('gone')}
  const navH=56, sw=stage.clientWidth, top=copy.offsetHeight+28;
  // phone: two straight columns, each carton with a readable label strip below it
  const ss=mobile?Math.min(1,(sw-48)/2/(W+30)):Math.max(.55,Math.min(1.3,sw*0.58/650,(innerHeight-navH)*0.72/400));
  const gridH=mobile?3*(D+GYM)*ss*Math.cos(RXM*Math.PI/180)+H*ss:0;
  const sh=mobile?Math.max(innerHeight-navH,top+gridH+130):Math.max(600,innerHeight-navH);
  const sx=mobile?sw/2:sw*0.6, sy=mobile?top+30+gridH/2:sh*0.55;
  // open net: never shrink the side-panel type below ~16px; let the page scroll a little instead
  const fs=Math.max(.5,Math.min(1,(sw-48)/NET_W,Math.max(.92,(innerHeight-navH-40)/NET_H)));
  G={sw,sh,sx,sy,ss,fs,fx:sw/2,fy:28+fs*NET_H/2,openH:84+fs*NET_H};
  G.SH=mobile?`translate(${sx}px,${sy}px) scale(${ss}) rotateX(${RXM}deg) rotateZ(0deg)`:`translate(${sx}px,${sy}px) scale(${ss}) rotateX(57deg) rotateZ(34deg)`;
  shelfScene.style.transform=G.SH;
  if(mobile){stage.style.height=sh+'px';const s=stage.getBoundingClientRect(),cw=Math.min(190,(sw-44)/2);
    cartons.forEach(a=>{const r=a.querySelector('.front').getBoundingClientRect(),st=a._strip;
      st.style.width=cw+'px';st.style.left=Math.round(Math.min(Math.max(r.left+r.width/2-s.left-cw/2,16),sw-16-cw))+'px';st.style.top=Math.round(r.bottom-s.top+16)+'px'})}
  const po=mobile?`${sw/2}px ${sy}px`:`${sw/2}px ${sh*0.2}px`;
  shelfLayer.style.perspective=mobile?'2600px':'';
  shelfLayer.style.perspectiveOrigin=po; olayer.style.perspectiveOrigin=po;
  setStatic(cur>=0);
}
// static end states (no animation)
const CLOSED={fb:'rotateX(-90deg)',ff:'rotateX(90deg)',fl:'rotateY(90deg)',fr:'rotateY(-90deg)',lid:'rotateX(-90deg)'};
const OPEN={fb:'rotateX(0deg)',ff:'rotateX(0deg)',fl:'rotateY(0deg)',fr:'rotateY(0deg)',lid:'rotateX(100deg)'};
function finalScene(){return `translate(${G.fx}px,${G.fy}px) scale(${G.fs}) rotateX(0deg) rotateZ(0deg)`}
function startCarton(i){const a=cartons[i];return `translate3d(${a._x}px,${a._y}px,${LZ}px) rotateZ(${LR}deg) scale3d(${K},${K},${K})`}
const END_CARTON='translate3d(0px,0px,0px) rotateZ(0deg) scale3d(1,1,1)';
function setStatic(open){
  shelfLayer.style.opacity=open?0:''; copy.style.opacity=open?0:''; foot.style.opacity=open?0:'';
  shelfLayer.style.visibility=open?'hidden':''; copy.style.visibility=open?'hidden':'';
  shelfLayer.inert=open; olayer.hidden=!open; olayer.inert=false; olayer.style.pointerEvents='';
  if(mobile){
    stage.style.height=open?'auto':G.sh+'px';
    [oscene,ocarton,...Object.values(fl)].forEach(e=>{e.style.transform='';e.style.opacity=''});
  }else{
    stage.style.height=(open?G.openH:G.sh)+'px';
    oscene.style.transform=finalScene(); ocarton.style.transform='none';
    for(const k in OPEN) fl[k].style.transform=OPEN[k];
    fl.lid.style.opacity=0; oshadow.style.opacity=0;
  }
}
function fill(i){
  const p=P[i], nx=P[(i+1)%P.length];
  $('pBase').innerHTML=`<div class="mono acc">Parcel ${p.n} / 06 &middot; Work</div><h1 id="ptitle" tabindex="-1">${esc(p.name)}</h1><div class="met"><b>${p.fig}</b><span>${p.cap}<br>${p.sub}</span></div>`;
  $('pLeft').innerHTML=`<div class="mono acc">01 &middot; What it is</div><h2>${p.what[0]}</h2><p>${p.what[1]}</p>`;
  $('pRight').innerHTML=`<div class="mono acc">02 &middot; How it is held</div><h2>${p.held[0]}</h2><p>${p.held[1]}</p>`;
  $('pTop').innerHTML=`<div class="row"><span class="mono acc">Packing slip</span><span class="mono mut">Parcel ${p.n} / 06 &middot; opened from the shelf</span></div>
   <dl class="slip"><dt>Contents</dt><dd>${esc(p.name)}</dd><dt>Declared figure</dt><dd>${p.fig} ${p.cap}${p.prod?'<span class="fn"> &mdash; '+FOOT+'</span>':''}</dd></dl>
   <div class="end"><a class="go" href="#shelf" data-go="">&larr; Back to the shelf</a><span class="bcl" aria-hidden="true"></span></div>`;
  $('pBot').innerHTML=`<div class="row"><span class="mono acc">03 &middot; Next parcel</span><span class="mono mut">Esc closes</span></div>
   <a class="nextcard" href="#${nx.slug}" data-go="${nx.slug}"><span class="mono mut">Parcel ${nx.n} / 06 &middot; Next parcel</span><span class="nm">${esc(nx.name)}</span><b>${nx.fig}</b></a>`;
  $('oLabel').innerHTML=labelHTML(p);
  ocarton.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.go)}));
  document.title=`${p.name} · Parcels · Damon Guan`;
}
function A(e,kf,dur,rev){const a=e.animate(kf,{duration:dur,fill:'both',direction:rev?'reverse':'normal'});anims.push(a);return a}
const EZ='cubic-bezier(.45,0,.2,1)', OUT='cubic-bezier(.2,.7,.25,1)';
const hold=(from,to,a,b,ease)=>[{transform:from,offset:0},{transform:from,offset:a,easing:ease||OUT},{transform:to,offset:b},{transform:to,offset:1}];
function runOpen(i,rev){
  anims.forEach(a=>a.cancel()); anims=[];
  const dur=rev?DUR_CLOSE:DUR;
  if(mobile){
    A(shelfLayer,[{opacity:1},{opacity:0,offset:.5},{opacity:0}],dur,rev);
    A(copy,[{opacity:1},{opacity:0,offset:.4},{opacity:0}],dur,rev);
    [fl.fb,fl.base,fl.fl,fl.fr,fl.ff].forEach((e,k)=>{const s=.1+k*.13,t=s+.36,
      c={transform:'perspective(900px) rotateX(-88deg)',opacity:0},o={transform:'perspective(900px) rotateX(0deg)',opacity:1};
      A(e,[{...c,offset:0},{...c,offset:s,easing:OUT},{...o,offset:t},{...o,offset:1}],dur,rev)});
  }else{
    A(oscene,[{transform:G.SH,easing:EZ},{transform:finalScene()}],dur,rev);
    A(ocarton,[{transform:startCarton(i),easing:EZ},{transform:END_CARTON}],dur,rev);
    A(fl.lid,[{transform:CLOSED.lid,opacity:1,offset:0},{transform:CLOSED.lid,opacity:1,offset:.06,easing:'cubic-bezier(.35,0,.25,1)'},{transform:'rotateX(70deg)',opacity:1,offset:.5},{transform:OPEN.lid,opacity:0,offset:.72},{transform:OPEN.lid,opacity:0,offset:1}],dur,rev);
    A(fl.fb,hold(CLOSED.fb,OPEN.fb,.32,.9),dur,rev);
    A(fl.ff,hold(CLOSED.ff,OPEN.ff,.18,.82),dur,rev);
    A(fl.fl,hold(CLOSED.fl,OPEN.fl,.24,.88),dur,rev);
    A(fl.fr,hold(CLOSED.fr,OPEN.fr,.26,.92),dur,rev);
    A(oshadow,[{opacity:1},{opacity:0,offset:.6},{opacity:0}],dur,rev);
    A(shelfScene,[{transform:G.SH,easing:EZ},{transform:G.SH+' translateZ(-240px)'}],dur,rev);
    A(shelfLayer,[{opacity:1},{opacity:0,offset:.55},{opacity:0}],dur,rev);
    A(copy,[{opacity:1},{opacity:0,offset:.35},{opacity:0}],dur,rev);
    A(foot,[{opacity:1},{opacity:0,offset:.35},{opacity:0}],dur,rev);
  }
  return Promise.all(anims.map(a=>a.finished));
}
async function open(i,animate){
  busy=true; hideTip(); fill(i); cur=i;
  cartons.forEach((c,k)=>c.classList.toggle('gone',k===i));
  if(animate){
    olayer.hidden=false; olayer.style.pointerEvents='none'; shelfLayer.inert=true;
    stage.style.height=mobile?'auto':Math.max(G.openH,G.sh)+'px';
    window.scrollTo(0,0);
    await runOpen(i,false).catch(()=>{});
  }
  setStatic(true); anims.forEach(a=>a.cancel()); anims=[];
  busy=false; $('ptitle').focus({preventScroll:true});
}
async function close(animate){
  const i=cur; busy=true;
  if(animate){
    olayer.style.pointerEvents='none'; olayer.inert=true;
    shelfLayer.style.visibility=''; copy.style.visibility='';
    if(!mobile) stage.style.height=Math.max(G.openH,G.sh)+'px';
    await runOpen(i,true).catch(()=>{});
  }
  cur=-1; setStatic(false); anims.forEach(a=>a.cancel()); anims=[];
  cartons[i].classList.remove('gone');
  document.title='Parcels · Design studies · Damon Guan';
  busy=false;
}
async function route(first){
  if(busy)return;
  const slug=location.hash.slice(1), i=P.findIndex(p=>p.slug===slug);
  if(i===cur)return;
  const animate=!first&&!RM.matches;
  if(cur>=0){const was=cur; await close(animate);
    if(i<0){const c=cartons[was]; c.focus({preventScroll:true}); c.classList.add('lift'); showTip(was)}}
  if(i>=0) await open(i,animate);
  route(false);                     // catch up if the hash moved while animating
}
function go(slug){
  history.pushState(null,'',slug?'#'+slug:location.pathname+location.search);
  route(false);
}
addEventListener('popstate',()=>route(false));
addEventListener('hashchange',()=>route(false));
addEventListener('keydown',e=>{if(e.key==='Escape'&&cur>=0)go('')});
let rz; addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{if(!busy)layout()})});
layout(); route(true);
// test hook: __parcels.open(i) then __parcels.seek(0..1) freezes the timeline
window.__parcels={open:i=>go(P[i].slug),close:()=>go(''),
  seek:t=>anims.forEach(a=>{a.pause();a.currentTime=t*a.effect.getComputedTiming().duration})};
})();
</script>
