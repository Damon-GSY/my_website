<!doctype html>
<html lang="en" class="pre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damon Guan — pill</title>
<meta name="description" content="Damon Guan: agentic RL, post-training and evaluation.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Archivo';src:url('archivo.woff2') format('woff2-variations');font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'Cartograph CF';src:url('/fonts/CartographCF-Regular.woff2') format('woff2');font-weight:400;font-display:swap}

:root{
  --white:#ffffff;--paper:#f2f2f1;--ink:#1d1d1d;--ink-2:#3a3a3a;--rule:#a9a9a6;
  --btn:#1b1b1b;--pill-fill:#d8d3cf;--line:#b9b9b9;
  --fs:min(19.6vh,13.2vw);
  --margin:clamp(20px,2.4vw,40px);
  --mono:'Cartograph CF',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Archivo',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --pill-w:calc(var(--fs) * 3.62);
  --pill-h:calc(var(--fs) * 1.81);
  --gap:calc(var(--fs) * .085);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
html{background:var(--white)}
body{
  background:var(--white);color:var(--ink);font-family:var(--sans);
  overflow:hidden;min-height:100svh;position:relative;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:3px}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;background:var(--paper);pointer-events:none;z-index:0}
.bg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bg path{fill:none;stroke:#fff;stroke-linecap:round;vector-effect:non-scaling-stroke}

/* ---------- hero ---------- */
.hero{
  position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);
  z-index:2;font-size:var(--fs);
}
.word{
  margin:0;font-size:1em;display:flex;align-items:center;justify-content:center;gap:var(--gap);
  font-weight:860;font-stretch:100%;letter-spacing:-.045em;line-height:.8;
  white-space:nowrap;color:var(--ink);
}
.half{display:block;position:relative}
/* trailing tracking would push the pill off-centre */
.half{margin-right:.045em}
.first{
  position:absolute;left:0;bottom:calc(100% + .16em);
  font:400 max(12px,calc(var(--fs) * .072))/1 var(--mono);
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
}
.pill{
  position:relative;flex:none;width:var(--pill-w);height:var(--pill-h);
  border-radius:999px;overflow:hidden;background:var(--pill-fill);
  clip-path:inset(0 round 999px);isolation:isolate;
}
.pill video{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(var(--fs) * 3.62);height:calc(var(--fs) * 1.81);
  object-fit:cover;opacity:1;display:block;
}
.pill .veil{position:absolute;inset:0;background:var(--line);opacity:0}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;top:0;z-index:3;
  display:flex;justify-content:space-between;align-items:center;gap:24px;
  padding:22px var(--margin);
  font-size:max(12px,calc(var(--fs) * .072));font-weight:450;
}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:1.6em}
.nav a{text-decoration:none;color:var(--ink)}
.nav a:hover{text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}

/* ---------- footer ---------- */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:3;
  display:flex;align-items:flex-end;gap:clamp(16px,2vw,32px);
  padding:0 var(--margin) clamp(20px,3vh,34px);
}
.blurb{
  margin:0;width:calc(var(--fs) * 1.42);flex:none;
  font-size:max(12px,calc(var(--fs) * .066));line-height:1.42;font-weight:420;color:var(--ink-2);
}
.blurb::first-letter{
  float:left;font-size:2.35em;line-height:.86;font-weight:650;color:var(--ink);
  margin:.06em .08em 0 0;
}
.row{flex:1;display:flex;align-items:center;gap:clamp(16px,2vw,28px);min-width:0;padding-bottom:.35em}
.rule{flex:1;height:1px;background:var(--rule);transform-origin:50% 50%;min-width:24px}
.actions{display:flex;align-items:center;gap:14px;flex:none}
.btn{
  display:inline-flex;align-items:center;gap:.6em;
  background:var(--btn);color:#fff;text-decoration:none;border-radius:999px;
  padding:.85em 1.35em;font:500 max(13px,calc(var(--fs) * .07))/1 var(--sans);white-space:nowrap;
}
.btn:hover{background:#000}
.btn svg{width:.9em;height:.9em}
.replay{
  background:none;border:0;padding:.5em .2em;cursor:pointer;color:var(--ink-2);
  font:400 max(11px,calc(var(--fs) * .06))/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
}
.replay:hover{color:var(--ink)}

/* ---------- initial state (before the timeline is attached) ---------- */
.pre .pill{width:calc(var(--fs) * .012);clip-path:inset(50% 0 round 999px)}
.pre .veil{opacity:1}
.pre .word{gap:calc(var(--fs) * .026)}
.pre .bg{opacity:0}
.pre .nav{transform:translateY(-140%)}
.pre .foot{transform:translateY(160%)}
.pre .rule{transform:scaleX(0)}

/* ---------- phone ---------- */
@media (max-width:720px){
  :root{
    --fs:min(34vw,16.5vh);--margin:20px;
    --pill-w:calc(100vw - 40px);--pill-h:calc((100vw - 40px) / 1.85);
  }
  .hero{width:calc(100vw - 40px)}
  .word{flex-direction:column}
  .pill video{width:calc(100vw - 40px);height:calc((100vw - 40px) / 1.85)}
  .first{font-size:12px;bottom:calc(100% + .7em)}
  .nav{padding:16px 20px;font-size:12.5px}
  .nav .ext{display:none}
  .nav ul{gap:1.4em}
  .foot{flex-direction:column;align-items:stretch;gap:14px;padding-bottom:18px}
  .blurb{width:auto;font-size:13px;line-height:1.5}
  .row{padding-bottom:0}
  .btn{font-size:13px}
  .replay{font-size:11px}
  .pre .pill{width:var(--pill-w);height:1.5px;clip-path:inset(0 50% round 999px)}
}
@media (max-width:720px) and (max-height:640px){
  .blurb{display:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg id="curves" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
</div>

<nav class="nav" aria-label="Primary">
  <ul>
    <li><a href="/#work">Work</a></li>
    <li><a href="/#evaluate">Evaluate</a></li>
    <li><a href="/#path">Path</a></li>
    <li><a href="/#notes">Notes</a></li>
  </ul>
  <ul class="ext">
    <li><a href="https://github.com/Damon-GSY" rel="noopener">GitHub</a></li>
    <li><a href="https://www.linkedin.com/in/shengyue-guan-1a7b3226b/" rel="noopener">LinkedIn</a></li>
  </ul>
</nav>

<main class="hero">
  <h1 class="word" aria-label="Damon Guan">
    <span class="half gu" aria-hidden="true"><span class="first">Damon</span>GU</span>
    <span class="pill" aria-hidden="true">
      <video id="ink" muted playsinline loop autoplay preload="auto" disablepictureinpicture>
        <source src="/ink/ink.webm" type="video/webm">
        <source src="/ink/ink.mp4" type="video/mp4">
      </video>
      <span class="veil"></span>
    </span>
    <span class="half an" aria-hidden="true">AN</span>
  </h1>
</main>

<footer class="foot">
  <p class="blurb">I train language agents, then measure whether they hold up on real work. Agentic RL, post-training and evaluation, built for decisions that have to be right.</p>
  <div class="row">
    <span class="rule" aria-hidden="true"></span>
    <div class="actions">
      <button class="replay" type="button" id="replay">Replay</button>
      <a class="btn" href="/">Open the site
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a>
    </div>
  </div>
</footer>

<script>
(function(){
  var root = document.documentElement;
  var DUR = 2100;
  var E1 = 'cubic-bezier(.5,0,.3,1)', E2 = 'cubic-bezier(.45,0,.3,1)', E3 = 'cubic-bezier(.4,0,.2,1)';
  var EASE_IN = 'cubic-bezier(.2,.8,.2,1)';
  var $ = function(s){ return document.querySelector(s); };
  var pill = $('.pill'), veil = $('.veil'), word = $('.word'), bg = $('.bg'),
      nav = $('.nav'), foot = $('.foot'), rule = $('.rule'), video = $('#ink');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var phone = window.matchMedia('(max-width:720px)');
  var anims = [];

  /* ---- background: ~15 long S-curves, deterministic ---- */
  (function curves(){
    var svg = document.getElementById('curves'), seed = 7;
    function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var out = '';
    for (var i = 0; i < 15; i++){
      var y0 = -80 + i * 78 + rnd() * 40, y1 = y0 + 160 + rnd() * 260;
      var a = 260 + rnd() * 320;
      var d = 'M -60 ' + y0.toFixed(1) +
        ' C ' + (280 + rnd()*80).toFixed(1) + ' ' + (y0 - a).toFixed(1) + ', ' +
        (640 + rnd()*80).toFixed(1) + ' ' + (y1 + a).toFixed(1) + ', 1060 ' + y1.toFixed(1);
      var w = (1.2 + rnd() * 2.7).toFixed(2), o = (.55 + rnd() * .30).toFixed(2);
      out += '<path d="' + d + '" stroke-width="' + w + '" stroke-opacity="' + o + '"/>';
    }
    svg.innerHTML = out;
  })();

  function fs(){ return parseFloat(getComputedStyle($('.hero')).fontSize); }

  function build(){
    anims.forEach(function(a){ a.cancel(); });
    var f = fs(), opts = { duration: DUR, fill: 'both' };
    var A = [];
    if (phone.matches){
      var w = window.innerWidth - 40, h = w / 1.85;
      A.push(pill.animate([
        { offset: 0,   height: '1.5px', easing: 'linear' },
        { offset: .14, height: '1.5px', easing: E1 },
        { offset: .30, height: (h * .10) + 'px', easing: E2 },
        { offset: .58, height: (h * .55) + 'px', easing: E3 },
        { offset: 1,   height: h + 'px' }
      ], opts));
      A.push(pill.animate([
        { offset: 0,   clipPath: 'inset(0 50% round 999px)' },
        { offset: .14, clipPath: 'inset(0 0% round 999px)' },
        { offset: 1,   clipPath: 'inset(0 0% round 999px)' }
      ], opts));
    } else {
      A.push(pill.animate([
        { offset: 0,   width: (f * .012) + 'px', easing: 'linear' },
        { offset: .14, width: (f * .012) + 'px', easing: E1 },
        { offset: .30, width: (f * .16) + 'px', easing: E2 },
        { offset: .58, width: (f * 1.81) + 'px', easing: E3 },
        { offset: 1,   width: (f * 3.62) + 'px' }
      ], opts));
      A.push(pill.animate([
        { offset: 0,   clipPath: 'inset(50% 0% round 999px)' },
        { offset: .14, clipPath: 'inset(0% 0% round 999px)' },
        { offset: 1,   clipPath: 'inset(0% 0% round 999px)' }
      ], opts));
    }
    A.push(veil.animate([
      { offset: 0, opacity: 1 }, { offset: .14, opacity: 1 },
      { offset: .30, opacity: 0 }, { offset: 1, opacity: 0 }
    ], opts));
    A.push(word.animate([
      { offset: 0,   gap: (f * .026) + 'px' },
      { offset: .14, gap: (f * .026) + 'px', easing: E2 },
      { offset: .58, gap: (f * .05) + 'px', easing: E3 },
      { offset: 1,   gap: (f * .085) + 'px' }
    ], opts));
    A.push(bg.animate([
      { offset: 0, opacity: 0 }, { offset: .45, opacity: 0, easing: 'ease-in-out' },
      { offset: .78, opacity: 1 }, { offset: 1, opacity: 1 }
    ], opts));
    A.push(nav.animate([
      { offset: 0, transform: 'translateY(-140%)' }, { offset: .50, transform: 'translateY(-140%)', easing: EASE_IN },
      { offset: .86, transform: 'translateY(0)' }, { offset: 1, transform: 'translateY(0)' }
    ], opts));
    A.push(foot.animate([
      { offset: 0, transform: 'translateY(160%)' }, { offset: .52, transform: 'translateY(160%)', easing: EASE_IN },
      { offset: .90, transform: 'translateY(0)' }, { offset: 1, transform: 'translateY(0)' }
    ], opts));
    A.push(rule.animate([
      { offset: 0, transform: 'scaleX(0)' }, { offset: .40, transform: 'scaleX(0)', easing: E3 },
      { offset: .95, transform: 'scaleX(1)' }, { offset: 1, transform: 'scaleX(1)' }
    ], opts));
    anims = A;
    root.classList.remove('pre');
    return A;
  }

  /* Drop the timeline and let the responsive CSS (final state) take over. */
  function settle(){
    anims.forEach(function(a){ a.finish(); a.cancel(); });
    anims = [];
    root.classList.remove('pre');
  }

  function play(){
    build();
    if (reduce.matches){ settle(); try{ video.pause(); }catch(e){} return; }
    var p = video.play(); if (p && p.catch) p.catch(function(){});
    Promise.all(anims.map(function(a){ return a.finished; })).then(function(){
      if (anims.length) settle();
    }, function(){});
  }

  var replaying = false;
  function replay(){
    if (replaying) return;
    if (reduce.matches) return;
    replaying = true;
    if (!anims.length){ build(); anims.forEach(function(a){ a.pause(); a.currentTime = DUR; }); }
    var cur = anims;
    cur.forEach(function(a){ a.playbackRate = -1; a.play(); });
    Promise.all(cur.map(function(a){ return a.finished; })).then(function(){
      if (anims !== cur){ replaying = false; return; }
      setTimeout(function(){
        replaying = false;
        if (anims !== cur) return;
        cur.forEach(function(a){ a.playbackRate = 1; a.play(); });
        Promise.all(cur.map(function(a){ return a.finished; })).then(function(){
          if (anims === cur) settle();
        }, function(){});
      }, 260);
    }, function(){ replaying = false; });
  }
  document.getElementById('replay').addEventListener('click', replay);

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    if (anims.length) settle();     // finish running animation; CSS resets the pill size
    replaying = false;
  });
  phone.addEventListener && phone.addEventListener('change', function(){ if (anims.length) settle(); });

  /* test hook */
  window.__pill = {
    get anims(){ return anims; }, build: build, settle: settle, duration: DUR,
    seek: function(t){ if (!anims.length) build(); anims.forEach(function(a){ a.pause(); a.currentTime = t; }); }
  };

  var started = false;
  function start(){ if (started) return; started = true; if (window.__pillHold) { build(); anims.forEach(function(a){a.pause();}); return; } play(); }
  if (reduce.matches){ settle(); try{ video.pause(); video.removeAttribute('autoplay'); }catch(e){} }
  else if (document.fonts && document.fonts.ready){
    Promise.all([document.fonts.load('860 1em Archivo', 'GUAN'), document.fonts.ready]).then(start, start);
    setTimeout(start, 2500);
  } else start();
})();
</script>
</body>
</html>
